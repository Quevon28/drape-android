name: DRAPE Android CI & APK Build

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test, Lint & Assemble Signed/Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DRAPE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          else
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias drape_release \
              -storepass drape_release_store_pass \
              -keypass drape_release_store_pass \
              -dname "CN=DRAPE App, OU=Mobile, O=DRAPE, L=Jakarta, S=DKI, C=ID"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: gradle lintDebug --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble Signed Release APK
        env:
          DRAPE_KEYSTORE_PASSWORD: ${{ secrets.DRAPE_KEYSTORE_PASSWORD || 'drape_release_store_pass' }}
          DRAPE_KEY_ALIAS: ${{ secrets.DRAPE_KEY_ALIAS || 'drape_release' }}
          DRAPE_KEY_PASSWORD: ${{ secrets.DRAPE_KEY_PASSWORD || 'drape_release_store_pass' }}
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drape-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drape-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

